# Allura Team Manifest — Bahari (platform deployment)
# Schema: ADR-002. Org tenancy: ADR-001. Curation division — the HITL gate.
# Bahari is the curator referenced by every other team's governance.curator field.
apiVersion: allura/v1
kind: Team
metadata:
  name: bahari
  organization: allura-system
  division: curation
brain:
  read:                             # Bahari reviews proposals across the platform tenant + canon.
    - allura-system                 # Per-client review runs under the client tenant (separate deploy).
  write:
    - allura-system
governance:
  curator: bahari                   # self — Bahari IS the curator
  promotion: hitl                   # Bahari proposes/validates; a human still approves promotion
  authority: review-only            # cannot create active knowledge; only moves the queue
agents:
  - bahari                # chief curator
  - pattern-detection     # identify recurring successful patterns
  - deduplication         # remove redundant knowledge
  - quality-auditing      # evaluate memory usefulness
  - evidence-validation   # verify promotion requests against traces
ui:
  icon: bahari
