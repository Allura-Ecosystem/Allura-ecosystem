# Allura Team Manifest — Team RAM (platform deployment)
# Schema: ADR-002. Org tenancy: ADR-001. This manifest deploys Team RAM AGAINST the platform tenant.
# To run Team RAM for a client, ship a separate manifest with metadata.organization = allura-<client>.
apiVersion: allura/v1
kind: Team
metadata:
  name: team-ram                    # stamped as metadata.team on every event this team writes
  organization: allura-system       # platform tenant (Allura-Ecosystem) — see org charter
  division: software-engineering
brain:
  read:                             # serving tenant + shared canon only
    - allura-system
  write:
    - allura-system
governance:
  curator: bahari
  promotion: hitl                   # never autonomous (invariant 4)
agents:                             # roles; user_id persona in parentheses
  - brooks        # (brooks-architect)   chief architect / orchestrator
  - woz           # (woz-builder)        implementation
  - pike          # (pike-interface)     interface review
  - fowler        # (fowler-refactor)    refactor gate
  - bellard       # (bellard-diagnostics) diagnostics / perf
  - carmack       # (carmack-performance) performance
  - knuth         # (knuth-data)         data architecture
  - hightower     # (hightower-devops)   devops / infra
  - scout         # (scout-recon)        recon / hydration
ui:
  icon: ram
